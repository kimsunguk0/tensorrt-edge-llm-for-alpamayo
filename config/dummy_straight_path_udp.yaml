# Straight-path UDP sender config for control-side coordinate/sign tests.
#
# NOTE: By current control-team agreement, raw_action.accel_mps2 carries
# velocity in m/s even though the field name says accel_mps2.

udp_host: 10.179.113.253
udp_port: 5005

send_hz: 10.0
num_points: 64
plan_dt_s: 0.1
inference_time_s: 0.0

# Constant forward speed [m/s].
accel_mps2: 1.0

# Zero curvature means a straight path.
curvature: 0.0

# Initial local path pose. +x forward, +y left.
initial_yaw_rad: 0.0
initial_x_m: 0.0
initial_y_m: 0.0
z_m: 0.0
