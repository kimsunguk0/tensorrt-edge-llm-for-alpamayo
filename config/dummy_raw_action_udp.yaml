# Dummy raw_action UDP sender config.
#
# NOTE: By current control-team agreement, the value placed in
# raw_action.accel_mps2 is used as m/s velocity even though the field name says
# accel_mps2.

udp_host: 10.179.113.253
udp_port: 5005

send_hz: 10.0
num_points: 64
plan_dt_s: 0.1
inference_time_s: 0.1

# Repeated for all 64 points in raw_action.accel_mps2.
accel_mps2: 1.0

# Repeated for all 64 points in raw_action.curvature.
# Alpamayo convention: y=LEFT, yaw=CCW, curvature=CCW.
curvature: 0.001

# Used only to make pred_xyz/pred_yaw_rad coherent for the parser/visual checks.
initial_yaw_rad: 0.0
initial_x_m: 0.0
initial_y_m: 0.0
z_m: 0.0
